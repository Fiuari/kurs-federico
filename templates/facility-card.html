                    <article class="accordion-item animate-on-scroll">
                        <header>
                            <div class="img-cell">
                                <img class="accordion-icon" src="assets/img/{{hero.file}}" alt="{{hero.alt}}">
                            </div>
                            <span class="number">{{number}}</span>
                            <a class="title facility-link" href="facilities/{{slug}}.html">{{name}}</a>
                            <p id="{{slug}}-summary">{{summary}} <a class="facility-details" href="facilities/{{slug}}.html">View details</a></p>
                            <button type="button" class="accordion-toggle" aria-expanded="false" aria-controls="{{slug}}-summary" aria-label="{{name}} overview">
                                <span class="sprite sprite-right" aria-hidden="true"></span>
                            </button>
                        </header>
                    </article>
