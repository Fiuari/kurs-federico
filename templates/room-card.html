<template id="public-room-card">
  <article class="rooms-wrapper">
    <img data-room-image class="pres-img" alt="" loading="lazy">
    <div class="buttons"><span class="sprite sprite-star" aria-hidden="true"></span><p>Since 1973</p></div>
    <div class="rooms-text-wrapper">
      <h3><a class="room-title-link" data-room-detail></a></h3>
      <p class="room-summary"></p><p class="room-price"></p>
    </div>
    <div class="rooms-booking-wrapper">
      <a class="room-photo-link" data-room-detail><img data-room-image class="main-pres-img" alt=""></a>
      <a class="decagon poly-booking" data-book-room>
        <span class="polygon sprite sprite-decagon-gold" aria-hidden="true"></span>
        <p>Book room</p>
      </a>
    </div>
  </article>
</template>
