    <div class="rooms-wrapper">
      <img src="assets/img/{{preview.file}}" alt="{{preview.alt}}" class="pres-img">
      <button type="button" class="decagon-rot poly-arrow" aria-label="Next room">
        <svg viewBox="0 0 100 100" class="polygon" aria-hidden="true">
          <polygon points="50,5 76.45,13.59 92.79,36.08 92.79,63.92 76.45,86.41 50,95 23.55,86.41 7.21,63.92 7.21,36.08 23.55,13.59"/>
        </svg>
        <img src="assets/img/icons/right.png" alt="" width="38">
      </button>
      <div class="buttons">
        <img src="assets/img/icons/Star.png" alt="" width="35">
        <p>Since 1973</p>
      </div>
      <div class="rooms-text-wrapper">
        <h3><a class="room-title-link" href="rooms/{{slug}}.html">{{name}}</a></h3>
        <p>{{summary}}</p>
        <p class="pagecounter">{{number}} / {{total}}</p>
      </div>
      <div class="rooms-booking-wrapper">
        <a class="room-photo-link" href="rooms/{{slug}}.html" aria-label="View {{name}}"><img src="assets/img/{{hero.file}}" alt="{{hero.alt}}" class="main-pres-img"></a>
        <a class="decagon poly-booking" href="rooms/{{slug}}.html#contact">
          <svg viewBox="0 0 100 100" class="polygon" aria-hidden="true">
            <polygon points="50,5 76.45,13.59 92.79,36.08 92.79,63.92 76.45,86.41 50,95 23.55,86.41 7.21,63.92 7.21,36.08 23.55,13.59"/>
          </svg>
          <p>Book room</p>
        </a>
      </div>
    </div>
