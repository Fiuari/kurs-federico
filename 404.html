<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="The requested BankHotel page could not be found. Return to the hotel website to explore rooms and make a reservation.">
  <title>404 · BankHotel</title>
  <script>
    (() => {
      const base = location.protocol === 'file:' ? new URL('.', location.href) : new URL(location.pathname.startsWith('/kurs-federico/') ? '/kurs-federico/' : '/', location.origin);
      for (const file of ['assets/css/error.css']) { const sheet=document.createElement('link'); sheet.rel='stylesheet'; sheet.href=new URL(file,base); document.head.append(sheet); }
      const icon=document.createElement('link'); icon.rel='icon'; icon.href=new URL('assets/img/favicon.svg?v=2',base); document.head.append(icon);
      const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = new URL('assets/css/i18n.css', base); document.head.append(css);
      const words = document.createElement('script'); words.src = new URL('assets/js/translations-uk.js', base);
      words.onload = () => { const script = document.createElement('script'); script.src = new URL('assets/js/i18n.js', base); document.head.append(script); };
      document.head.append(words);
    })();
  </script>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Sorry, something went wrong</p>
    <a id="back" href="/kurs-federico/"><span aria-hidden="true">←</span> Go back</a>
  </main>
  <script>
    const back = document.getElementById("back");
    // GitHub Pages serves this HTML at the missing URL, even several folders deep.
    if (location.protocol === "file:") {
      back.href = "index.html";
    } else if (!location.pathname.startsWith("/kurs-federico/")) {
      back.href = "/index.html";
    }
    if (document.referrer && history.length > 1) {
      const previous = new URL(document.referrer);
      const home = new URL(back.href);
      const sitePath = new URL(".", home).pathname;
      if (previous.origin === home.origin && previous.pathname.startsWith(sitePath) &&
          previous.pathname !== location.pathname && !/\/(about|contacts|404)\.html$/.test(previous.pathname)) {
        back.addEventListener("click", event => {
          if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
          event.preventDefault();
          history.back();
        });
      }
    }
  </script>
</body>
</html>
