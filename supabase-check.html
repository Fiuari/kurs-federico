<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Перевірка Supabase · BankHotel</title>
  <link rel="stylesheet" href="assets/css/default.css">
  <style>
    body { background: #fffcf6; color: #313f38; line-height: 1.5; }
    main { max-width: 850px; margin: auto; padding: 3rem 1.25rem; }
    h1, h2 { font-family: Arial, sans-serif; }
    h1 { margin: 1.5rem 0; font-size: clamp(1.8rem, 5vw, 2.7rem); }
    h2 { font-size: 1.4rem; margin-bottom: .5rem; }
    a { color: inherit; }
    button { padding: .85rem 1.2rem; margin: 1rem 0; background: #fcd043; color: #313f38; border: 1px solid #313f38; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    ul { list-style: none; }
    li { border-top: 1px solid #a9b1a6; padding: 1.5rem 0; }
    li p + p { margin-top: .7rem; }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
  <script defer src="assets/js/supabase-client.js"></script>
  <script defer src="assets/js/supabase-check.js"></script>
</head>
<body>
  <main>
    <a href="index.html">← BankHotel</a>
    <h1>Підключення Supabase</h1>
    <p id="connection-status" role="status">Підготовка перевірки…</p>
    <button id="check-connection" type="button">Перевірити підключення</button>
    <ul id="database-rooms" aria-label="Номери з бази даних"></ul>
    <noscript>Для перевірки потрібно увімкнути JavaScript.</noscript>
  </main>
</body>
</html>
